<div class="info-container">
  <button mat-icon-button matTooltip="{{ tooltipText }}" class="info-ripple">
    <mat-icon>info</mat-icon>
    <span class="pulse"></span>
  </button>
  <!-- Label temporal con fade-out -->
  <span 
    class="info-label" 
    *ngIf="showLabel" 
    [class.fade-out]="fadingOut">
    <!--{{ tooltipText }}-->
     Información.
  </span>
</div>
