<div class="info-container">
  <button mat-icon-button matTooltip="{{ tooltipText }}" class="info-ripple">
    <mat-icon>info</mat-icon>
    <span class="pulse"></span>
    
  </button>
  <span 
      class="info-label" 
      *ngIf="showLabel" 
      [class.fade-out]="fadingOut">
      {{ tooltipText }}
    </span>
</div>
