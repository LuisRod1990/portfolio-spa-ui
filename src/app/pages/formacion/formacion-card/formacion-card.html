<ng-container *ngIf="state$ | async as state">
  <app-loading *ngIf="state.loading"></app-loading>

  <div class="formacion-container" *ngIf="!state.loading && !state.error">
    <!-- Sección izquierda -->
    <div class="formacion-left neumorphic fade-inAptitud">
      <div *ngIf="state.formaciones[state.currentIndex] as f">
        <h2>{{ f.nivel }} - {{ f.titulo }}</h2>
        <h3>{{ f.institucion }}</h3>
        <p>{{ f.ubicacion }}</p>
        <p>{{ f.fechainicio | date:'yyyy' }} - {{ f.fechafin | date:'yyyy' }}</p>
      </div>
    </div>

    <!-- Sección derecha -->
    <div class="formacion-right neumorphic fade-inAptitud">
      <div *ngIf="state.formaciones[state.currentIndex] as f">
        <img *ngIf="f.urlfoto1" [src]="f.urlfoto1" alt="Foto 1" class="foto-plantel" />
        <img *ngIf="f.urlfoto2" [src]="f.urlfoto2" alt="Foto 2" class="foto-plantel" />
        <div class="formacion-links">
          <a *ngIf="f.urlsitio1" [href]="f.urlsitio1" target="_blank">Sitio 1</a>
          <a *ngIf="f.urlsitio2" [href]="f.urlsitio2" target="_blank">Sitio 2</a>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="state.error" class="error-msg">
    {{ state.error }}
  </div>
</ng-container>
